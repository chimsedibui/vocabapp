name: Build and release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/ci/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (auto uses a newer source version or increments patch)
        type: choice
        default: auto
        options: [auto, patch, minor, major]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: true
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          python3 scripts/ci/version.py --bump "$BUMP" > /tmp/version.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/version.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key,value in data.items(): f.write(f'{key}={value}\n')
          PY
  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1
      - name: Prepare stable APK signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/vocabapp.jks"
          chmod 600 "$RUNNER_TEMP/vocabapp.jks"
      - name: Build signed release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vocabapp.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --no-pub --target-platform android-arm64 --build-name "$VERSION" --build-number "$BUILD"
      - run: python3 scripts/ci/package.py android --version "$VERSION" --build "$BUILD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: artifacts/*
          retention-days: 14
      - if: always()
        run: rm -f "$RUNNER_TEMP/vocabapp.jks"
  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub --concurrency=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub --build-name $env:VERSION --build-number $env:BUILD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle VC++ runtime and build Windows installer
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64\Microsoft.VC*.CRT\*.dll"
          if (-not $crt) { throw 'VC++ redistributable DLLs not found' }
          Copy-Item $crt.FullName app/build/windows/x64/runner/Release -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc installer/VocabApp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python scripts/ci/package.py windows --version $env:VERSION --build $env:BUILD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: artifacts/*
          retention-days: 14
  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      TAG: ${{ needs.version.outputs.tag }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - run: python3 scripts/ci/package.py manifest --version "$VERSION" --build "$BUILD"
      - name: Commit tested version, tag and publish
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA" || { echo 'Main changed during build; newer run will release it.'; exit 1; }
          git switch -C main "$SOURCE_SHA"
          python3 scripts/ci/version.py --write "$VERSION+$BUILD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/pubspec.yaml
          if ! git diff --cached --quiet; then git commit -m "chore: release $TAG [skip ci]"; fi
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          gh release create "$TAG" artifacts/* --draft --verify-tag --title "VocabApp $VERSION" --generate-notes
          gh release edit "$TAG" --draft=false --latest
